id: de.churchprojector.ChurchProjector
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ChurchProjector
finish-args:
  - --device=dri
  - --filesystem=host
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
modules:
  - name: churchprojector
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - cp -a . /app/bin/
      - install -Dm644 de.churchprojector.ChurchProjector.desktop /app/share/applications/de.churchprojector.ChurchProjector.desktop
      - install -Dm644 de.churchprojector.ChurchProjector.png /app/share/icons/hicolor/16x16/apps/de.churchprojector.ChurchProjector.png
    sources:
      - type: dir
        path: flatpak-source
