name: Release Workflow

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        include:
        - platform: linux-x64
          os: ubuntu-latest
        - platform: linux-arm64
          os: ubuntu-24.04-arm
          
        - platform: win-x64
          os: windows-latest

        - platform: osx-x64
          os: macos-latest

        - platform: osx-arm64
          os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.platform }}
        run: |
          dotnet publish -c Release ./ChurchProjector/ChurchProjector/ChurchProjector.csproj --runtime ${{ matrix.platform }} --output ./publish/${{ matrix.platform }} /p:Version="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}" /p:InformationalVersion="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}" /p:FileVersion="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}"

      - name: Build PowerPoint worker (Windows only)
        if: matrix.platform == 'win-x64'
        run: |
          dotnet publish -c Release ./ChurchProjector/ChurchProjector.PowerPoint/ChurchProjector.PowerPoint.csproj --runtime ${{ matrix.platform }} --output ./publish/${{ matrix.platform }}/worker /p:Version="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}" /p:InformationalVersion="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}" /p:FileVersion="${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}"

      - name: Copy worker into main output (Windows only)
        if: matrix.platform == 'win-x64'
        shell: bash
        run: |
          mv ./publish/${{ matrix.platform }}/worker/* ./publish/${{ matrix.platform }}/

      - name: Cleanup
        shell: bash
        run: |
          find . -type f -path '*/win-x86/*' -delete
          find . -type f -name '*.pdb' -delete
          find ./publish -name "*.dSYM" -type d -exec rm -rf {} +

      - name: Install Linux packaging tools
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder rpm snapd zstd
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Create Linux packages
        if: startsWith(matrix.platform, 'linux')
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.1' }}
          RUNTIME: ${{ matrix.platform }}
        run: |
          ./build/scripts/package.deb.sh
          ./build/scripts/package.rpm.sh
          ./build/scripts/package.pacman.sh
          ./build/scripts/package.snap.sh
          ./build/scripts/package.flatpak.sh
          ./build/scripts/package.appimage.sh

      - name: Zip ${{ matrix.platform }} artifact
        if: matrix.platform == 'win-x64'
        run: |
          Compress-Archive -Path "./publish/${{ matrix.platform }}/*" -DestinationPath "${{ matrix.platform }}.zip"
      
      - name: Package macOS App
        if: startsWith(matrix.platform, 'osx')
        shell: bash
        run: |
          chmod +x ./build/macos/build-app.sh
          ./build/macos/build-app.sh "${{ matrix.platform }}" "${{ github.ref_name }}"

      - name: Upload DEB artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-deb
          path: churchprojector_*.deb

      - name: Upload RPM artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-rpm
          path: churchprojector-*.rpm

      - name: Upload Pacman artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-pacman
          path: churchprojector-*.pkg.tar.zst

      - name: Upload Snap artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-snap
          path: churchprojector-*.snap

      - name: Upload Flatpak artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-flatpak
          path: churchprojector-*.flatpak

      - name: Upload AppImage artifact
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-appimage
          path: churchprojector-*.AppImage

      # Upload the zip artifact for non-Linux platforms (Windows)
      - name: Upload Artifact
        if: matrix.platform == 'win-x64' || startsWith(matrix.platform, 'osx')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
        
    needs: build

    steps: 
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.deb
            ./artifacts/**/*.rpm
            ./artifacts/**/*.pkg.tar.zst
            ./artifacts/**/*.snap
            ./artifacts/**/*.flatpak
            ./artifacts/**/*.AppImage
